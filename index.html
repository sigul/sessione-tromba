<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sessione Tromba</title>
  <meta name="description" content="Algoritmo di studio per tromba. Play-along di Corso di Tromba, metodo Davide Pianegonda." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,620&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0e0f12; --surface:#16171c; --surface2:#1d1e24; --fg:#eceae4; --muted:#9a9993; --subtle:#6f6e69; --accent:#c5cdd6; --accent-fg:#0e0f12; --border:#2a2b32; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: Figtree, system-ui, sans-serif; line-height: 1.5; }
    header { position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
    header strong { font-family: Fraunces, serif; font-weight: 560; }
    header span { color: var(--subtle); font-size: 12px; margin-left: 8px; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    nav button, .btn { background: transparent; color: var(--muted); border: 0; cursor: pointer; height: 40px; padding: 0 12px; border-radius: 8px; font: inherit; }
    nav button.active, nav button:hover { background: var(--surface2); color: var(--fg); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 36px 20px 80px; }
    h1, h2, legend { font-family: Fraunces, serif; letter-spacing: -0.02em; }
    h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.1; margin: 8px 0 12px; }
    .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--subtle); }
    .muted { color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: 24px; }
    .grid { display: grid; gap: 8px; }
    .grid.two { grid-template-columns: 1fr 1fr; }
    @media (max-width: 640px) { .grid.two { grid-template-columns: 1fr; } }
    .choice { text-align: left; width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; cursor: pointer; }
    .choice.sel { border-color: var(--accent); background: var(--surface2); }
    .choice small { display: block; color: var(--muted); margin-top: 4px; }
    .choice .meta { display: block; margin-top: 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--subtle); }
    .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .btn.primary { background: var(--accent); color: var(--accent-fg); }
    .btn:disabled { opacity: .35; cursor: default; }
    .steps { display: flex; gap: 6px; margin: 28px 0 16px; }
    .steps i { flex: 1; height: 4px; border-radius: 99px; background: var(--border); }
    .steps i.on { background: var(--accent); }
    iframe { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 12px; background: #000; }
    .yt { margin: 8px 0 16px; }
    .yt a { color: var(--muted); font-size: 12px; }
    footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; color: var(--subtle); font-size: 12px; }
    footer a { color: var(--muted); }
    .hidden { display: none; }
    .timer { font-variant-numeric: tabular-nums; font-size: 40px; }
    aside.note { background: var(--surface2); border-radius: 16px; padding: 16px; margin-top: 16px; }
    .chips { display: flex; gap: 8px; overflow: auto; padding-bottom: 8px; }
    .chips button { white-space: nowrap; height: 36px; border-radius: 999px; border: 0; padding: 0 12px; background: var(--surface); color: var(--muted); cursor: pointer; }
    .chips button.on { background: var(--accent); color: var(--accent-fg); }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .thumbs a { color: inherit; text-decoration: none; border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); display: block; }
    .thumbs img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
    .thumbs p { margin: 0; padding: 10px 12px 14px; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div><strong>Sessione Tromba</strong><span>algoritmo di studio</span></div>
    <nav>
      <button data-page="studio" class="active">Studio</button>
      <button data-page="catalogo">Catalogo</button>
      <button data-page="metodo">Metodo</button>
      <button data-page="diario">Diario</button>
    </nav>
  </header>
  <main class="wrap">
    <section id="studio"></section>
    <section id="sessione" class="hidden"></section>
    <section id="catalogo" class="hidden"></section>
    <section id="metodo" class="hidden"></section>
    <section id="diario" class="hidden"></section>
  </main>
  <footer>
    Ispirato al metodo di <a href="https://corsoditromba.com" target="_blank" rel="noreferrer">Corso di Tromba</a>
    · Prof. Davide Pianegonda · video da
    <a href="https://www.youtube.com/@CORSODITROMBA" target="_blank" rel="noreferrer">YouTube CORSO DI TROMBA</a>
  </footer>
  <script src="./app.js"></script>
</body>
</html>
